[profile.default]
src = 'src'
out = 'out'
libs = ['lib', "dependencies"]

# Compilation
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000
via_ir = true
extra_output_files = ["metadata", "irOptimized"]

# Testing
block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT

[fmt]
line_length = 80
int_types = "short"
number_underscore = "preserve"
ignore = []

[doc]
out = "docs_generated" # Note to not overwrite own docs

[soldeer]
# See https://github.com/mario-eth/soldeer/blob/main/USAGE.md#configuration
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_location = "txt"
recursive_deps = true

# Profile to compile without --via-ir and optimizations
# Run via `FOUNDRY_PROFILE=no-via-ir forge ...`
[profile.no-via-ir]
optimizer = false
via_ir = false

# Profile for intense testing
# Run via `FOUNDRY_PROFILE=intense forge t`
[profile.intense]
[profile.intense.fuzz]
runs = 100_000
[profile.intense.invariant]
runs = 100_000

# Profile for CI testing
# Run via `FOUNDRY_PROFILE=ci forge t`
[profile.ci]
[profile.ci.fuzz]
runs = 5_000
[profile.ci.invariant]
runs = 5_000

# Profile for zkSync compilation
[profile.default.zksync]
zksolc = "1.5.1"

[dependencies]
forge-std = "1.9.7"
chronicle-std = { version = "2.1.0", git = "https://github.com/chronicleprotocol/chronicle-std", rev = "ea9afe78a1d33245afcdbcc3f530ee9cbd7cde28" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
